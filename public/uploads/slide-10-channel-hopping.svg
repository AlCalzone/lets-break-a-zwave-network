<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Channel hopping: scan, lock, receive</title>
  <desc id="description">Aligned schematic timelines show a 9.6 kbit/s frame, the receiver's active radio profile, and a separate LR frame. The receiver detects the 9.6 preamble after visiting other profiles, extends its stay, recognizes SOF, receives and validates the frame, then resumes scanning. The LR frame passes entirely while the receiver is occupied on 9.6. All timing is schematic.</desc>
  <defs>
    <marker id="time-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#65798b"></path>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"></rect>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243b4c">
    <text x="60" y="66" font-size="42" font-weight="700">Channel hopping: scan, lock, receive</text>
    <text x="60" y="106" font-size="23" fill="#65798b">Combined classic + LR controller. One active receive profile at a time.</text>
    <g id="profile-key" stroke="#9eb5c7" stroke-width="1.5">
      <rect x="60" y="150" width="330" height="56" rx="5" fill="#8da8bf"></rect>
      <rect x="460" y="150" width="330" height="56" rx="5" fill="#bed0df"></rect>
      <rect x="860" y="150" width="330" height="56" rx="5" fill="#dbe5ed"></rect>
      <rect x="1260" y="150" width="330" height="56" rx="5" fill="#c8bfd5"></rect>
    </g>
    <g text-anchor="middle" font-size="25" font-weight="700">
      <text x="225" y="186">9.6 kbit/s</text>
      <text x="625" y="186">40 kbit/s</text>
      <text x="1025" y="186">100 kbit/s</text>
      <text x="1425" y="186">LR A or B</text>
    </g>
    <text x="1650" y="186" font-size="23">Receive profiles</text>
    <g font-size="21">
      <text x="370" y="252">1. Scan</text>
      <text x="720" y="252" text-anchor="middle">2. Preamble detected</text>
      <text x="1100" y="252" text-anchor="middle">3. SOF detected</text>
      <text x="1680" y="252" text-anchor="middle">4. Resume scanning</text>
    </g>
    <path d="M350 281H1870" fill="none" stroke="#65798b" stroke-width="1.5" marker-end="url(#time-arrow)"></path>
    <text x="60" y="286" font-size="18" fill="#65798b">Time, schematic</text>
    <rect id="busy-window" x="720" y="489" width="960" height="375" fill="#edf2f6"></rect>
    <g id="event-guides" fill="none" stroke="#9ab0c1" stroke-width="1.5" stroke-dasharray="5 6">
      <path data-event="preamble-detected" d="M720 295V860"></path>
      <path data-event="sof-detected" d="M1100 295V860"></path>
      <path data-event="scan-resumes" d="M1680 295V860"></path>
    </g>
    <g font-size="27" font-weight="700">
      <text x="60" y="384">9.6 kbit/s</text>
      <text x="60" y="550">Receiver</text>
      <text x="60" y="782">LR on air</text>
    </g>
    <g font-size="20" fill="#65798b">
      <text x="60" y="414">on air</text>
      <text x="60" y="580">active profile</text>
    </g>
    <g id="classic-frame" data-profile="9.6" stroke="#ffffff" stroke-width="1">
      <rect data-part="preamble" x="600" y="350" width="430" height="66" fill="#dce6ee"></rect>
      <rect data-part="sof" x="1030" y="350" width="70" height="66" fill="#a9c0d2"></rect>
      <rect data-part="header" x="1100" y="350" width="150" height="66" fill="#8da8bf"></rect>
      <rect data-part="data" x="1250" y="350" width="280" height="66" fill="#aacbd9"></rect>
      <rect data-part="fcs" x="1530" y="350" width="50" height="66" fill="#697f99"></rect>
      <rect data-part="eof" x="1580" y="350" width="40" height="66" fill="#4f606f"></rect>
    </g>
    <g text-anchor="middle">
      <text x="815" y="390" font-size="25">Preamble: 55 55 ...</text>
      <text x="1065" y="378" font-size="19">SOF</text>
      <text x="1065" y="404" font-size="17">F0</text>
      <text x="1175" y="390" font-size="22">Header</text>
      <text x="1390" y="390" font-size="24">Command / data</text>
      <text x="1555" y="390" font-size="17" fill="#ffffff">FCS</text>
      <text x="1600" y="390" font-size="14" fill="#ffffff">EOF</text>
    </g>
    <text x="740" y="456" font-size="20" fill="#526c80">Enough preamble remains to acquire timing.</text>
    <g id="receiver-profile" stroke="#ffffff" stroke-width="1">
      <rect data-phase="scan" data-profile="9.6" x="360" y="518" width="80" height="62" fill="#8da8bf"></rect>
      <rect data-phase="scan" data-profile="40" x="440" y="518" width="80" height="62" fill="#bed0df"></rect>
      <rect data-phase="scan" data-profile="100" x="520" y="518" width="80" height="62" fill="#dbe5ed"></rect>
      <rect data-phase="scan" data-profile="LR" x="600" y="518" width="80" height="62" fill="#c8bfd5"></rect>
      <rect data-phase="scan" data-profile="9.6" x="680" y="518" width="40" height="62" fill="#8da8bf"></rect>
      <rect data-phase="acquire" data-profile="9.6" x="720" y="518" width="380" height="62" fill="#678eac"></rect>
      <rect data-phase="receive" data-profile="9.6" x="1100" y="518" width="520" height="62" fill="#3f6b88"></rect>
      <rect data-phase="finish" x="1620" y="518" width="60" height="62" fill="#dce4ea"></rect>
      <rect data-phase="resume" data-profile="40" x="1680" y="518" width="60" height="62" fill="#bed0df"></rect>
      <rect data-phase="resume" data-profile="100" x="1740" y="518" width="60" height="62" fill="#dbe5ed"></rect>
      <rect data-phase="resume" data-profile="LR" x="1800" y="518" width="60" height="62" fill="#c8bfd5"></rect>
    </g>
    <g text-anchor="middle">
      <g font-size="22" font-weight="700">
        <text x="400" y="557">9.6</text>
        <text x="480" y="557">40</text>
        <text x="560" y="557">100</text>
        <text x="640" y="557">LR</text>
      </g>
      <text x="700" y="556" font-size="15">9.6</text>
      <text x="910" y="557" font-size="24" fill="#ffffff">9.6: synchronize and stay</text>
      <text x="1360" y="557" font-size="24" fill="#ffffff">9.6: receive and validate</text>
      <text x="1650" y="555" font-size="15">finish</text>
      <g font-size="19">
        <text x="1710" y="556">40</text>
        <text x="1770" y="556">100</text>
        <text x="1830" y="556">LR</text>
      </g>
    </g>
    <text x="1100" y="637" font-size="22" font-weight="700">Other receive profiles are unattended during this interval.</text>
    <g id="lr-frame" data-profile="LR" data-received="false" stroke="#ffffff" stroke-width="1">
      <rect data-part="preamble" x="1140" y="745" width="180" height="58" fill="#ddd4e5"></rect>
      <rect data-part="rest-of-frame" x="1320" y="745" width="140" height="58" fill="#bcb0cf"></rect>
    </g>
    <g text-anchor="middle" font-size="21">
      <text x="1230" y="782">Preamble</text>
      <text x="1390" y="782">Frame body</text>
    </g>
    <text x="980" y="846" font-size="21" fill="#90565e">Missed: the receiver stays on 9.6 for the entire LR frame.</text>
    <text x="1810" y="743" text-anchor="end" font-size="19" fill="#65798b">The next LR visit</text>
    <text x="1810" y="774" text-anchor="end" font-size="19" fill="#65798b">happens after it ends.</text>
    <path d="M1830 587V800" fill="none" stroke="#9f91af" stroke-width="1.5" stroke-dasharray="4 5"></path>
    <path d="M60 915H1860" stroke="#d6e1e9" stroke-width="2"></path>
    <text x="60" y="960" font-size="29" font-weight="700">A clear channel does not guarantee an available receiver.</text>
    <text x="60" y="1004" font-size="21" fill="#65798b">The LR sender can get no ACK even though its channel was clear.</text>
    <text x="60" y="1044" font-size="18" fill="#65798b">Conceptual timing only. ACK/response timing is omitted. Resume scanning after the current radio operation finishes.</text>
  </g>
</svg>