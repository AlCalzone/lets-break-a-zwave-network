<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Beaming: wake the receiver before the command</title>
  <desc id="description">A receiver catches a matching beam during a brief radio check. The lower panels compare continuous and fragmented formats. In the fragmented panel, aligned receiver and sender lanes show the receiver waking during the second fragment and sending an ACK during the following gap. The sender receives that ACK, stops the remaining beam train, and sends DATA. A beam-frame inset shows preamble, SOF, beam tag, and target information.</desc>
  <defs>
    <pattern id="beam-tiles" width="20" height="42" patternUnits="userSpaceOnUse">
      <rect width="20" height="42" fill="#96b4c8"></rect>
      <path d="M20 0V42" stroke="#ffffff" stroke-width="1"></path>
      <text x="10" y="27" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#36556d">B</text>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#496f87"></path>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"></rect>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243b4c">
    <text x="60" y="65" font-size="40" font-weight="700">Beaming: wake the receiver before the command</text>
    <text x="60" y="105" font-size="23" fill="#65798b">FLiRS devices briefly check the radio. Repeated wake-up frames cover one of those checks.</text>
    <text x="60" y="188" font-size="25" font-weight="700">Receiver</text>
    <text x="60" y="214" font-size="18" fill="#65798b">frequently listening</text>
    <text x="60" y="282" font-size="25" font-weight="700">Sender</text>
    <g id="receiver-wake-up" stroke="#ffffff" stroke-width="1">
      <rect data-state="sleep" x="300" y="160" width="260" height="44" fill="#e8edf2"></rect>
      <rect data-state="check" x="560" y="160" width="40" height="44" fill="#8cadc2"></rect>
      <rect data-state="sleep" x="600" y="160" width="340" height="44" fill="#e8edf2"></rect>
      <rect data-state="check-match" x="940" y="160" width="40" height="44" fill="#496f87"></rect>
      <rect data-state="awake" x="980" y="160" width="820" height="44" fill="#bdd6e4"></rect>
    </g>
    <g text-anchor="middle">
      <text x="430" y="189" font-size="21">sleep</text>
      <text x="580" y="187" font-size="12">check</text>
      <text x="770" y="189" font-size="21">sleep</text>
      <text x="960" y="187" font-size="12" fill="#ffffff">check</text>
      <text x="1390" y="189" font-size="22">stays awake for the command</text>
    </g>
    <rect id="wake-up-beam" x="800" y="255" width="640" height="42" fill="url(#beam-tiles)"></rect>
    <path d="M1450 276H1498" fill="none" stroke="#496f87" stroke-width="2.5" marker-end="url(#arrow)"></path>
    <rect id="wake-up-data" x="1510" y="255" width="190" height="42" rx="4" fill="#d9e8f1" stroke="#9bb6c8"></rect>
    <text x="1605" y="283" text-anchor="middle" font-size="22" font-weight="700">DATA</text>
    <path d="M980 149V306" fill="none" stroke="#496f87" stroke-width="1.5" stroke-dasharray="4 5"></path>
    <text x="1005" y="236" font-size="19">Address/hash match</text>
    <text x="1120" y="330" text-anchor="middle" font-size="20" fill="#526c80">Many short, addressed beam frames</text>
    <path d="M60 365H1860" stroke="#d6e1e9" stroke-width="2"></path>
    <path d="M960 390V786" stroke="#d6e1e9" stroke-width="2"></path>
    <text x="60" y="412" font-size="31" font-weight="700">Continuous</text>
    <text x="60" y="450" font-size="22" fill="#526c80">Classic two-channel regions / 40 kbit/s</text>
    <text x="1040" y="412" font-size="31" font-weight="700">Fragmented</text>
    <text x="1040" y="450" font-size="22" fill="#526c80">LR + classic three-channel regions / 100 kbit/s</text>
    <g id="continuous-beams">
      <text x="65" y="565" font-size="23">Short</text>
      <rect id="short-beam" data-duration-ms="275" data-scale-px-per-ms="0.4" x="200" y="536" width="110" height="42" fill="url(#beam-tiles)"></rect>
      <text x="255" y="520" text-anchor="middle" font-size="23" font-weight="700">~275 ms</text>
      <path d="M320 557H374" fill="none" stroke="#496f87" stroke-width="2.5" marker-end="url(#arrow)"></path>
      <rect x="385" y="536" width="90" height="42" rx="4" fill="#d9e8f1" stroke="#9bb6c8"></rect>
      <text x="430" y="564" text-anchor="middle" font-size="21">DATA</text>
      <text x="200" y="607" font-size="19" fill="#526c80">For a 250 ms listening interval</text>
      <text x="65" y="686" font-size="23">Long</text>
      <rect id="long-beam" data-duration-ms="1100" data-scale-px-per-ms="0.4" x="200" y="657" width="440" height="42" fill="url(#beam-tiles)"></rect>
      <text x="420" y="641" text-anchor="middle" font-size="23" font-weight="700">~1100 ms</text>
      <path d="M650 678H699" fill="none" stroke="#496f87" stroke-width="2.5" marker-end="url(#arrow)"></path>
      <rect x="710" y="657" width="90" height="42" rx="4" fill="#d9e8f1" stroke="#9bb6c8"></rect>
      <text x="755" y="685" text-anchor="middle" font-size="21">DATA</text>
      <text x="200" y="728" font-size="19" fill="#526c80">For a 1000 ms listening interval</text>
      <text x="60" y="773" font-size="23">Fixed train, then DATA.</text>
    </g>
    <g id="fragmented-beam" data-full-train-ms="3000" data-example-period-ms="195">
      <text x="1040" y="533" font-size="21" font-weight="700">Receiver</text>
      <text x="1040" y="676" font-size="21" font-weight="700">Sender</text>
      <g id="fragmented-receiver" stroke="#ffffff" stroke-width="1">
        <rect data-state="sleep" x="1170" y="506" width="350" height="42" fill="#e8edf2"></rect>
        <rect data-state="check-match" x="1520" y="506" width="30" height="42" fill="#496f87"></rect>
        <rect data-state="awake" x="1550" y="506" width="290" height="42" fill="#bdd6e4"></rect>
      </g>
      <g text-anchor="middle">
        <text x="1345" y="534" font-size="21">asleep</text>
        <text x="1535" y="532" font-size="10" fill="#ffffff">check</text>
        <text x="1740" y="534" font-size="20">awake for DATA</text>
      </g>
      <path d="M1550 493V694" fill="none" stroke="#7896aa" stroke-width="1.5" stroke-dasharray="4 5"></path>
      <text x="1535" y="486" text-anchor="middle" font-size="17">Match</text>
      <g id="fragmented-sender-listens" fill="#f2f5f8" stroke="#d7e1e9">
        <rect data-state="listen" x="1310" y="648" width="103.75" height="42"></rect>
        <rect data-state="listen" x="1553.75" y="648" width="86.25" height="42"></rect>
      </g>
      <g id="fragments" data-scale-px-per-ms="1.25" data-origin-x="1170">
        <rect data-start-ms="0" data-duration-ms="112" x="1170" y="648" width="140" height="42" fill="url(#beam-tiles)"></rect>
        <rect data-start-ms="195" data-duration-ms="112" x="1413.75" y="648" width="140" height="42" fill="url(#beam-tiles)"></rect>
      </g>
      <text x="1240" y="631" text-anchor="middle" font-size="20" font-weight="700">~110 ms</text>
      <text x="1361.875" y="676" text-anchor="middle" font-size="16" fill="#65798b">listen</text>
      <text x="1596.875" y="676" text-anchor="middle" font-size="16" fill="#65798b">listen</text>
      <g id="fragmented-beam-ack" data-sender="receiver" data-receiver="sender">
        <rect data-kind="beam-ack" x="1559" y="509" width="72" height="36" rx="16" fill="#ffffff" stroke="#496f87" stroke-width="2"></rect>
        <text x="1595" y="534" text-anchor="middle" font-size="19" font-weight="700">ACK</text>
        <path d="M1595 553V648" fill="none" stroke="#496f87" stroke-width="2.5" marker-end="url(#arrow)"></path>
        <text x="1615" y="605" font-size="19">ACK to beam</text>
      </g>
      <rect id="fragmented-data" data-kind="data" x="1640" y="648" width="120" height="42" rx="4" fill="#d9e8f1" stroke="#9bb6c8"></rect>
      <text x="1700" y="676" text-anchor="middle" font-size="21">DATA</text>
      <path d="M1170 701V714H1413.75V701" fill="none" stroke="#7896aa" stroke-width="1.5"></path>
      <text x="1291.875" y="741" text-anchor="middle" font-size="18">~200 ms between starts</text>
      <text x="1530" y="741" font-size="19">ACK ends the beam train.</text>
      <text x="1040" y="780" font-size="21">Full train: 3 s. This example finishes early.</text>
    </g>
    <text x="60" y="838" font-size="26" font-weight="700">Inside each small beam frame</text>
    <g id="beam-frame" stroke="#ffffff" stroke-width="1.5">
      <rect data-part="preamble" x="60" y="866" width="310" height="48" fill="#e1e8ef"></rect>
      <rect data-part="sof" x="370" y="866" width="170" height="48" fill="#c5d4e0"></rect>
      <rect data-part="tag" x="540" y="866" width="240" height="48" fill="#a9c6d8"></rect>
      <rect data-part="target-information" x="780" y="866" width="1080" height="48" fill="#d4e5ee"></rect>
    </g>
    <g text-anchor="middle" font-size="23">
      <text x="215" y="898">Preamble</text>
      <text x="455" y="898">SOF</text>
      <text x="660" y="898">Beam tag: 0x55</text>
      <text x="1320" y="898">Target information</text>
    </g>
    <text x="60" y="951" font-size="20" fill="#526c80">Classic: Node ID + optional Home ID hash. LR: TX power + 12-bit Node ID + Home ID hash.</text>
    <text x="60" y="1001" font-size="28" font-weight="700">Wake-up traffic occupies airtime before the application command.</text>
    <text x="60" y="1045" font-size="18" fill="#65798b">G.9959 continuous recommendations. Singlecast examples. Separate panel scales. Wake-up timing, tile counts, and ACK/DATA widths are schematic.</text>
  </g>
</svg>