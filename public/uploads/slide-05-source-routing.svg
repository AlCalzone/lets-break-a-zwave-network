<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Source routing: the sender writes the path</title>
  <desc id="description">A forward-only sequence diagram from controller 1 through repeaters 2 and 3 to lamp 7. Each arrow carries a complete 17-byte MAC frame. The ordered repeater list 02 03 stays unchanged. The count and hop byte changes from 20 to 21 to 22. The XOR checksum changes from 9D to 9C to 9F. The diagram ends when the third frame reaches node 7.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#385b73"></path>
    </marker>
    <g id="packet-template">
      <rect width="476" height="42" fill="#e7edf2"></rect>
      <rect x="112" width="28" height="42" fill="#c8d9e5"></rect>
      <rect x="140" width="28" height="42" fill="#a5c3d5"></rect>
      <rect x="224" width="28" height="42" fill="#c8d9e5"></rect>
      <rect x="252" width="28" height="42" fill="#d7e4ec"></rect>
      <rect x="280" width="28" height="42" fill="#3e7291"></rect>
      <rect x="308" width="56" height="42" fill="#9ab9c9"></rect>
      <rect x="364" width="84" height="42" fill="#d2e1e8"></rect>
      <rect x="448" width="28" height="42" fill="#3e7291"></rect>
      <path d="M0 0H476V42H0Z M28 0V42 M56 0V42 M84 0V42 M112 0V42 M140 0V42 M168 0V42 M196 0V42 M224 0V42 M252 0V42 M280 0V42 M308 0V42 M336 0V42 M364 0V42 M392 0V42 M420 0V42 M448 0V42" fill="none" stroke="#ffffff" stroke-width="1.2"></path>
      <g font-family="monospace" font-size="18" text-anchor="middle" fill="#354f63">
        <text x="14" y="28">12</text>
        <text x="42" y="28">34</text>
        <text x="70" y="28">56</text>
        <text x="98" y="28">78</text>
        <text x="126" y="28">01</text>
        <text x="154" y="28">81</text>
        <text x="182" y="28">03</text>
        <text x="210" y="28">11</text>
        <text x="238" y="28">07</text>
        <text x="266" y="28">00</text>
        <text x="322" y="28">02</text>
        <text x="350" y="28">03</text>
        <text x="378" y="28">20</text>
        <text x="406" y="28">01</text>
        <text x="434" y="28">FF</text>
      </g>
      <g font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#65798b">
        <text x="126" y="-14">MAC header</text>
        <text x="308" y="-14">Routing</text>
        <text x="406" y="-14">Basic Set</text>
        <text x="462" y="-14">FCS</text>
      </g>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"></rect>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243b4c">
    <text x="60" y="66" font-size="40" font-weight="700">Source routing: the sender writes the path</text>
    <text x="60" y="104" font-size="22">40 kbit/s | Basic Set: on | Route chosen by node 1: 1 -&gt; 2 -&gt; 3 -&gt; 7</text>
    <g fill="#edf2f6" stroke="#bacbd8" stroke-width="1.5">
      <rect x="25" y="148" width="150" height="80" rx="5"></rect>
      <rect x="585" y="148" width="150" height="80" rx="5"></rect>
      <rect x="1145" y="148" width="150" height="80" rx="5"></rect>
      <rect x="1705" y="148" width="150" height="80" rx="5"></rect>
    </g>
    <g text-anchor="middle">
      <g font-size="23" font-weight="700">
        <text x="100" y="181">Controller</text>
        <text x="660" y="181">Repeater</text>
        <text x="1220" y="181">Repeater</text>
        <text x="1780" y="181">Lamp</text>
      </g>
      <g font-size="21">
        <text x="100" y="212">Node 1</text>
        <text x="660" y="212">Node 2</text>
        <text x="1220" y="212">Node 3</text>
        <text x="1780" y="212">Node 7</text>
      </g>
    </g>
    <g stroke="#b8c7d3" stroke-width="2" stroke-dasharray="6 6">
      <path d="M100 228V845"></path>
      <path d="M660 228V845"></path>
      <path d="M1220 228V845"></path>
      <path d="M1780 228V845"></path>
    </g>
    <g fill="#dce7ef" stroke="#a4bbc9">
      <rect x="652" y="369" width="16" height="185"></rect>
      <rect x="1212" y="554" width="16" height="185"></rect>
    </g>
    <g font-size="20">
      <text x="142" y="274">Hop 0: next repeater is node 2</text>
      <text x="702" y="459">Hop 1: next repeater is node 3</text>
      <text x="1262" y="644">Hop 2: next receiver is destination 7</text>
    </g>
  </g>
  <g id="frame-0" transform="translate(142 310)" data-sender="1" data-receiver="2" data-hop="0" data-bytes="12 34 56 78 01 81 03 11 07 00 20 02 03 20 01 FF 9D">
    <use href="#packet-template"></use>
    <g font-family="monospace" font-size="18" text-anchor="middle" fill="#ffffff">
      <text x="294" y="28"><tspan fill="#d4e6f0">2</tspan><tspan font-weight="700">0</tspan></text>
      <text x="462" y="28">9D</text>
    </g>
  </g>
  <g id="frame-1" transform="translate(702 495)" data-sender="2" data-receiver="3" data-hop="1" data-bytes="12 34 56 78 01 81 03 11 07 00 21 02 03 20 01 FF 9C">
    <use href="#packet-template"></use>
    <g font-family="monospace" font-size="18" text-anchor="middle" fill="#ffffff">
      <text x="294" y="28"><tspan fill="#d4e6f0">2</tspan><tspan font-weight="700">1</tspan></text>
      <text x="462" y="28">9C</text>
    </g>
  </g>
  <g id="frame-2" transform="translate(1262 680)" data-sender="3" data-receiver="7" data-hop="2" data-bytes="12 34 56 78 01 81 03 11 07 00 22 02 03 20 01 FF 9F">
    <use href="#packet-template"></use>
    <g font-family="monospace" font-size="18" text-anchor="middle" fill="#ffffff">
      <text x="294" y="28"><tspan fill="#d4e6f0">2</tspan><tspan font-weight="700">2</tspan></text>
      <text x="462" y="28">9F</text>
    </g>
  </g>
  <g stroke="#385b73" stroke-width="3" marker-end="url(#arrow)">
    <path id="transmission-0" d="M100 369H660"></path>
    <path id="transmission-1" d="M660 554H1220"></path>
    <path id="transmission-2" d="M1220 739H1780"></path>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243b4c">
    <g font-size="19">
      <text x="687" y="414">Advance hop, recompute FCS, transmit.</text>
      <text x="1247" y="599">Advance hop, recompute FCS, transmit.</text>
    </g>
    <rect x="1570" y="780" width="310" height="52" rx="5" fill="#dce9ef"></rect>
    <text x="1725" y="814" text-anchor="middle" font-size="23" font-weight="700">Frame reaches node 7</text>
    <path d="M60 882H1860" stroke="#d6e1e9" stroke-width="2"></path>
    <text x="60" y="926" font-size="24" font-weight="700">How the routing header is encoded</text>
    <g font-family="monospace" font-size="28">
      <text x="60" y="974">00 | 20 / 21 / 22 | 02 03</text>
    </g>
    <g font-size="19" fill="#526c80">
      <text x="60" y="1006">Flags | two repeaters + changing hop | ordered node IDs</text>
      <text x="790" y="925">81 in MAC control marks this as a routed singlecast.</text>
      <text x="790" y="961">Source 01, destination 07, route 02 03, and command 20 01 FF stay unchanged.</text>
      <text x="790" y="997">Dark cells: changing hop position and its updated checksum.</text>
      <text x="60" y="1051">Each arrow shows one complete MPDU in hex. Each radio transmission also has its own PHY preamble and SOF. Vertical spacing is schematic.</text>
    </g>
  </g>
</svg>