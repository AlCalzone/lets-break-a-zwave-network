<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Retry, reroute, discover</title>
  <desc id="description">The left side separates an eligible direct-send rate sequence of 100, 100, then 40 kbit/s from a conditional Silicon Labs controller recovery flow: preferred or last working route, next-to-last working route, calculated routes or additional direct attempts, then enabled and eligible explorer fallback. On the right, an explorer reaches neighbors 2 and 4. Node 4 forwards to node 7. A Search Result returns through node 4 to node 1.</desc>
  <defs>
    <marker id="forward-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#587f98"></path>
    </marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#274a64"></path>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"></rect>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243b4c">
    <text x="60" y="66" font-size="42" font-weight="700">Retry, reroute, discover</text>
    <text x="60" y="106" font-size="22" fill="#65798b">Retry the transmission. Try another path. Discover one if needed.</text>
    <path d="M860 138V910" stroke="#d6e1e9" stroke-width="2"></path>
    <text x="65" y="155" font-size="27" font-weight="700">Silicon Labs controller policy</text>
    <rect x="60" y="180" width="700" height="142" rx="7" fill="#f0f4f7" stroke="#c4d3df"></rect>
    <text x="85" y="211" font-size="21">Inset: an eligible direct send starting at 100 kbit/s</text>
    <g id="direct-rate-example">
      <g fill="#d5e4ed" stroke="#7c9db3" stroke-width="1.5">
        <rect data-rate="100000" x="90" y="233" width="145" height="44" rx="5"></rect>
        <rect data-rate="100000" x="300" y="233" width="145" height="44" rx="5"></rect>
        <rect data-rate="40000" x="510" y="233" width="145" height="44" rx="5"></rect>
      </g>
      <g text-anchor="middle" font-size="25" font-weight="700">
        <text x="162.5" y="263">100 kbit/s</text>
        <text x="372.5" y="263">100 kbit/s</text>
        <text x="582.5" y="263">40 kbit/s</text>
      </g>
      <g stroke="#587f98" stroke-width="2.5" marker-end="url(#forward-arrow)">
        <path d="M244 255H290"></path>
        <path d="M454 255H500"></path>
      </g>
      <g text-anchor="middle" font-size="17" fill="#65798b">
        <text x="162.5" y="305">Initial send</text>
        <text x="372.5" y="305">Retry 1</text>
        <text x="582.5" y="305">Retry 2</text>
      </g>
    </g>
    <g id="policy-flow">
      <g fill="#e9f0f5" stroke="#a6bdcd" stroke-width="1.5">
        <rect id="preferred-route" x="160" y="364" width="520" height="68" rx="6"></rect>
        <rect id="older-route" x="160" y="474" width="520" height="68" rx="6"></rect>
        <rect id="other-attempts" x="160" y="584" width="520" height="82" rx="6"></rect>
        <rect id="explorer-fallback" x="160" y="708" width="520" height="86" rx="6" fill="#c5dce9"></rect>
      </g>
      <g text-anchor="middle" font-size="25">
        <text x="420" y="394">Preferred route / LWR</text>
        <text x="420" y="420" font-size="17">Last Working Route</text>
        <text x="420" y="504">NLWR, if available</text>
        <text x="420" y="530" font-size="17">Next-to-Last Working Route</text>
        <text x="420" y="618">Calculated routes</text>
        <text x="420" y="648" font-size="22">+ additional direct attempts</text>
        <text x="420" y="745" font-weight="700">Explorer frames</text>
        <text x="420" y="778" font-size="21">if enabled and eligible</text>
      </g>
      <g stroke="#587f98" stroke-width="2.5" marker-end="url(#forward-arrow)">
        <path d="M420 436V465"></path>
        <path d="M420 546V575"></path>
        <path d="M420 670V699"></path>
      </g>
    </g>
    <g font-size="19" fill="#526c80">
      <text x="85" y="836">Try alternatives on failure. Stop on success.</text>
      <text x="85" y="873">Available routes, device role, and options affect the flow.</text>
    </g>
    <text x="925" y="155" font-size="27" font-weight="700">Explorer frames: discover a path</text>
    <text x="925" y="214" font-size="24">1. Spread copies of the command</text>
    <text x="925" y="250" font-size="17" fill="#526c80">One transmission reaches both neighbors.</text>
    <g id="explorer-spread">
      <g fill="none" stroke="#587f98" stroke-width="3" marker-end="url(#forward-arrow)">
        <path data-sender="1" data-receiver="2" data-transmission="origin" d="M1063 353L1298 294"></path>
        <path data-sender="1" data-receiver="4" data-transmission="origin" d="M1063 377L1298 435"></path>
        <path data-sender="4" data-receiver="7" data-transmission="forward-4" d="M1368 445H1672"></path>
      </g>
      <g stroke="#799bb1" stroke-width="2">
        <circle cx="1030" cy="365" r="37" fill="#d8e6ef"></circle>
        <circle cx="1335" cy="285" r="37" fill="#edf2f6"></circle>
        <circle cx="1335" cy="445" r="37" fill="#b6d2e2"></circle>
        <circle cx="1710" cy="445" r="37" fill="#b6d2e2"></circle>
      </g>
      <g text-anchor="middle" font-size="28" font-weight="700">
        <text x="1030" y="375">1</text>
        <text x="1335" y="295">2</text>
        <text x="1335" y="455">4</text>
        <text x="1710" y="455">7</text>
      </g>
      <g font-size="18" fill="#526c80">
        <text x="1395" y="283">Other candidate</text>
        <text x="1395" y="310">Queued copy</text>
        <text x="1030" y="425" text-anchor="middle">Source</text>
        <text x="1515" y="424" text-anchor="middle">Path records node 4</text>
        <text x="1710" y="507" text-anchor="middle">Destination</text>
      </g>
    </g>
    <text x="925" y="559" font-size="20" fill="#526c80">Random delays, duplicate detection, and a hop limit bound the spread.</text>
    <text x="925" y="623" font-size="24">2. Return the first successful path</text>
    <g id="explorer-result">
      <g fill="none" stroke="#274a64" stroke-width="3" marker-end="url(#return-arrow)">
        <path data-sender="7" data-receiver="4" d="M1672 715H1373"></path>
        <path data-sender="4" data-receiver="1" d="M1297 715H1068"></path>
      </g>
      <g fill="#d8e6ef" stroke="#799bb1" stroke-width="2">
        <circle cx="1030" cy="715" r="37"></circle>
        <circle cx="1335" cy="715" r="37"></circle>
        <circle cx="1710" cy="715" r="37"></circle>
      </g>
      <g text-anchor="middle" font-size="28" font-weight="700">
        <text x="1030" y="725">1</text>
        <text x="1335" y="725">4</text>
        <text x="1710" y="725">7</text>
      </g>
      <text x="1515" y="691" text-anchor="middle" font-size="20">Search Result</text>
    </g>
    <g font-size="21" fill="#526c80">
      <text x="925" y="801">Stop cancels queued copies at nodes hearing the result.</text>
      <text x="925" y="845">Later traffic can reuse 1 -&gt; 4 -&gt; 7.</text>
    </g>
    <path d="M60 920H1860" stroke="#d6e1e9" stroke-width="2"></path>
    <g font-size="21">
      <text x="60" y="966">MAC rule for acknowledged singlecast: initial send + up to two retries. Random backoff: 10-40 ms.</text>
      <text x="60" y="1003">Network rule: at least three direct/routed attempts before Normal Explore recovery.</text>
    </g>
    <text x="60" y="1044" font-size="18" fill="#65798b">Simplified controller-policy illustration. Exact transmission order depends on the frame, configuration, and available paths.</text>
  </g>
</svg>