<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Routed transmission: local retries and Routed Error</title>
  <desc id="description">DATA reaches node 3 through nodes 1 and 2. Node 3's transmission to node 7 and two local retries are lost. After its final confirmation timeout, node 3 returns a Routed Error through node 2 to node 1. Node 1 sends an ordinary ACK confirming receipt of the error. Dotted extensions show selected implicit confirmations through overhearing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#385b73"></path>
    </marker>
    <g id="data-shape">
      <rect x="-46" y="-18" width="92" height="36" rx="4" fill="#a5c5d4" stroke="#628aa2" stroke-width="1.5"></rect>
      <text y="7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#243b4c">DATA</text>
    </g>
    <g id="ack-shape">
      <rect x="-36" y="-18" width="72" height="36" rx="16" fill="#ffffff" stroke="#496f87" stroke-width="2"></rect>
      <text y="7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#385b73">ACK</text>
    </g>
    <g id="error-shape">
      <rect x="-72" y="-18" width="144" height="36" rx="4" fill="#a6616b"></rect>
      <text y="7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Routed Error</text>
    </g>
    <g id="loss-mark">
      <path d="M-10 -10L10 10M-10 10L10 -10" stroke="#a55c64" stroke-width="4" fill="none"></path>
    </g>
  </defs>
  <rect width="1000" height="1020" fill="#ffffff"></rect>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243b4c">
    <text x="35" y="48" font-size="32" font-weight="700">Routed: retries and error return</text>
    <text x="35" y="83" font-size="21">Example: the link from node 3 to node 7 fails.</text>
    <g fill="#edf2f6" stroke="#bacbd8" stroke-width="1.5">
      <rect x="44" y="112" width="112" height="58" rx="4"></rect>
      <rect x="304" y="112" width="112" height="58" rx="4"></rect>
      <rect x="564" y="112" width="112" height="58" rx="4"></rect>
      <rect x="824" y="112" width="112" height="58" rx="4"></rect>
    </g>
    <g text-anchor="middle" font-size="23" font-weight="700">
      <text x="100" y="149">Node 1</text>
      <text x="360" y="149">Node 2</text>
      <text x="620" y="149">Node 3</text>
      <text x="880" y="149">Node 7</text>
    </g>
    <g stroke="#bacbd8" stroke-width="2" stroke-dasharray="6 6">
      <path d="M100 170V930 M360 170V930 M620 170V930 M880 170V930"></path>
    </g>
  </g>
  <g id="routed-sequence">
    <g id="data-1-2" data-kind="data" data-sender="1" data-receiver="2" data-received="true">
      <path class="transmission" d="M100 220H360" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#data-shape" x="230" y="220"></use>
    </g>
    <g id="data-2-3" data-kind="data" data-sender="2" data-receiver="3" data-received="true">
      <path class="transmission" d="M360 290H620" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#data-shape" x="490" y="290"></use>
    </g>
    <g id="failed-initial" data-kind="data" data-sender="3" data-receiver="7" data-received="false" data-attempt="1">
      <path class="transmission" d="M620 375H795" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#data-shape" x="708" y="375"></use>
      <use href="#loss-mark" x="795" y="375"></use>
    </g>
    <g id="failed-retry-1" data-kind="data" data-sender="3" data-receiver="7" data-received="false" data-attempt="2">
      <path class="transmission" d="M620 470H795" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#data-shape" x="708" y="470"></use>
      <use href="#loss-mark" x="795" y="470"></use>
    </g>
    <g id="failed-retry-2" data-kind="data" data-sender="3" data-receiver="7" data-received="false" data-attempt="3">
      <path class="transmission" d="M620 565H795" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#data-shape" x="708" y="565"></use>
      <use href="#loss-mark" x="795" y="565"></use>
    </g>
    <g id="error-3-2" data-kind="error" data-sender="3" data-receiver="2" data-received="true">
      <path class="transmission" d="M620 715H360" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#error-shape" x="490" y="715"></use>
    </g>
    <g id="error-2-1" data-kind="error" data-sender="2" data-receiver="1" data-received="true">
      <path class="transmission" d="M360 805H100" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#error-shape" x="230" y="805"></use>
    </g>
    <g id="error-receipt-ack" data-kind="ack" data-sender="1" data-receiver="2" data-received="true">
      <path class="transmission" d="M100 890H360" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#ack-shape" x="230" y="890"></use>
    </g>
  </g>
  <g id="local-waits" fill="#dce7ef" stroke="#9db2c2">
    <rect x="610" y="393" width="20" height="55"></rect>
    <rect x="610" y="488" width="20" height="55"></rect>
    <rect x="610" y="583" width="20" height="42"></rect>
  </g>
  <g id="overhearing" fill="none" stroke="#7896aa" stroke-width="2" stroke-dasharray="3 6">
    <path data-frame="data-2-3" data-listener="1" d="M360 290H100"></path>
    <path data-frame="failed-initial" data-listener="2" d="M620 375H360"></path>
    <path data-frame="error-2-1" data-listener="3" d="M360 805H620"></path>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#526c80">
    <g font-size="17">
      <text x="230" y="279" text-anchor="middle">overheard</text>
      <text x="490" y="364" text-anchor="middle">overheard</text>
      <text x="490" y="794" text-anchor="middle">overheard</text>
      <text x="643" y="430">Wait + backoff</text>
      <text x="643" y="525">Wait + backoff</text>
      <text x="643" y="614">Timeout</text>
      <text x="820" y="477">Retry 1</text>
      <text x="820" y="572">Retry 2</text>
    </g>
    <text x="620" y="661" font-size="22" font-weight="700" fill="#90565e">Retries exhausted</text>
    <text x="620" y="690" font-size="18">Node 3 reports the failed hop.</text>
    <text x="55" y="847" font-size="18" fill="#90565e">Error received</text>
    <text x="35" y="976" font-size="22" font-weight="700" fill="#243b4c">Final ACK confirms receipt of the error.</text>
    <text x="35" y="1006" font-size="18">The source can try another route. Timing and retry counts are illustrative.</text>
  </g>
</svg>