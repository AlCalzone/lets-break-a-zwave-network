<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1020" viewBox="0 0 780 1020" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Direct transmission: DATA lost or ACK lost</title>
  <desc id="description">Two direct singlecast cases between nodes 1 and 7. In the first, DATA is lost and no ACK is sent. In the second, DATA arrives but the ACK is lost. In both cases node 1 times out, waits a random backoff, retransmits the same frame, and receives the next ACK.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#385b73"></path>
    </marker>
    <g id="data-shape">
      <rect x="-46" y="-18" width="92" height="36" rx="4" fill="#a5c5d4" stroke="#628aa2" stroke-width="1.5"></rect>
      <text y="7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#243b4c">DATA</text>
    </g>
    <g id="ack-shape">
      <rect x="-36" y="-18" width="72" height="36" rx="16" fill="#ffffff" stroke="#496f87" stroke-width="2"></rect>
      <text y="7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#385b73">ACK</text>
    </g>
    <g id="loss-mark">
      <path d="M-10 -10L10 10M-10 10L10 -10" stroke="#a55c64" stroke-width="4" fill="none"></path>
    </g>
  </defs>
  <rect width="780" height="1020" fill="#ffffff"></rect>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243b4c">
    <text x="35" y="48" font-size="32" font-weight="700">Direct: missing ACK</text>
    <text x="35" y="84" font-size="21">The sender sees the same timeout.</text>
    <text x="35" y="139" font-size="25" font-weight="700">1. DATA lost</text>
    <text x="35" y="553" font-size="25" font-weight="700">2. ACK lost</text>
    <g fill="#edf2f6" stroke="#bacbd8" stroke-width="1.5">
      <rect x="83" y="157" width="114" height="52" rx="4"></rect>
      <rect x="573" y="157" width="114" height="52" rx="4"></rect>
      <rect x="83" y="570" width="114" height="52" rx="4"></rect>
      <rect x="573" y="570" width="114" height="52" rx="4"></rect>
    </g>
    <g text-anchor="middle" font-size="23" font-weight="700">
      <text x="140" y="190">Node 1</text>
      <text x="630" y="190">Node 7</text>
      <text x="140" y="603">Node 1</text>
      <text x="630" y="603">Node 7</text>
    </g>
    <g stroke="#bacbd8" stroke-width="2" stroke-dasharray="6 6">
      <path d="M140 209V490 M630 209V490"></path>
      <path d="M140 622V933 M630 622V933"></path>
    </g>
    <path d="M35 510H745" stroke="#d6e1e9" stroke-width="1.5"></path>
  </g>
  <g id="data-loss-case">
    <g id="data-lost" data-kind="data" data-sender="1" data-receiver="7" data-received="false" data-sequence="3">
      <path class="transmission" d="M140 250H500" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#data-shape" x="320" y="250"></use>
      <use href="#loss-mark" x="500" y="250"></use>
    </g>
    <g id="data-loss-wait">
      <rect data-phase="ack-wait" x="128" y="265" width="24" height="65" fill="#e4ebf1" stroke="#9db2c2"></rect>
      <rect data-phase="backoff" x="128" y="330" width="24" height="35" fill="#c8d9e5" stroke="#7896aa"></rect>
    </g>
    <g id="data-loss-retry" data-kind="data" data-sender="1" data-receiver="7" data-received="true" data-sequence="3">
      <path class="transmission" d="M140 405H630" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#data-shape" x="385" y="405"></use>
    </g>
    <g id="data-loss-success-ack" data-kind="ack" data-sender="7" data-receiver="1" data-received="true">
      <path class="transmission" d="M630 465H140" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#ack-shape" x="385" y="465"></use>
    </g>
  </g>
  <g id="ack-loss-case">
    <g id="ack-loss-initial-data" data-kind="data" data-sender="1" data-receiver="7" data-received="true" data-sequence="3">
      <path class="transmission" d="M140 652H630" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#data-shape" x="385" y="652"></use>
    </g>
    <g id="ack-lost" data-kind="ack" data-sender="7" data-receiver="1" data-received="false">
      <path class="transmission" d="M630 718H300" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#ack-shape" x="465" y="718"></use>
      <use href="#loss-mark" x="300" y="718"></use>
    </g>
    <g id="ack-loss-wait">
      <rect data-phase="ack-wait" x="128" y="667" width="24" height="97" fill="#e4ebf1" stroke="#9db2c2"></rect>
      <rect data-phase="backoff" x="128" y="764" width="24" height="41" fill="#c8d9e5" stroke="#7896aa"></rect>
    </g>
    <g id="ack-loss-retry" data-kind="data" data-sender="1" data-receiver="7" data-received="true" data-sequence="3">
      <path class="transmission" d="M140 850H630" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#data-shape" x="385" y="850"></use>
    </g>
    <g id="ack-loss-success-ack" data-kind="ack" data-sender="7" data-receiver="1" data-received="true">
      <path class="transmission" d="M630 915H140" fill="none" stroke="#385b73" stroke-width="3" marker-end="url(#arrow)"></path>
      <use href="#ack-shape" x="385" y="915"></use>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526c80">
    <text x="630" y="291" text-anchor="middle">No DATA received</text>
    <text x="630" y="318" text-anchor="middle">No ACK sent</text>
    <text x="164" y="303">Wait for ACK</text>
    <text x="164" y="331">Timeout</text>
    <text x="164" y="357">Backoff</text>
    <text x="385" y="380" text-anchor="middle">Retry</text>
    <text x="630" y="688" text-anchor="middle">DATA received</text>
    <text x="164" y="694">Wait for ACK</text>
    <text x="300" y="747" fill="#90565e">ACK lost</text>
    <text x="164" y="765">Timeout</text>
    <text x="164" y="797">Backoff</text>
    <text x="385" y="825" text-anchor="middle">Retry</text>
    <text x="35" y="975" font-size="23" font-weight="700" fill="#243b4c">No ACK leaves delivery unconfirmed.</text>
    <text x="35" y="1006">Retries keep the same sequence number.</text>
    <text x="610" y="1006" font-size="15">Schematic timing</text>
  </g>
</svg>