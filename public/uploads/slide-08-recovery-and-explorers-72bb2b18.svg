<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Retry, reroute, discover</title>
  <desc id="description">The left side distinguishes direct retry sequences from routed first-hop retries. The right side is a requested illustrative scenario with assumed destination duplicate handling. Node 1 broadcasts to nodes 2 and 4. Node 2's copy reaches node 7 first. Node 4's later copy reaches node 7 and is discarded in this illustration. Node 7 answers the first copy with a Search Result through node 2 to node 1.</desc>
  <defs>
    <marker id="forward-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#587f98"></path>
    </marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#274a64"></path>
    </marker>
    <marker id="duplicate-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#95a8b7"></path>
    </marker>
    <g id="search-result-shape">
      <rect x="-72" y="-17" width="144" height="34" rx="4" fill="#496f87"></rect>
      <text y="6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff">Search Result</text>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"></rect>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243b4c">
    <text x="60" y="66" font-size="42" font-weight="700">Retry, reroute, discover</text>
    <text x="60" y="106" font-size="22" fill="#65798b">Retry the transmission. Try another path. Discover one if needed.</text>
    <path d="M860 138V910" stroke="#d6e1e9" stroke-width="2"></path>
    <text x="65" y="155" font-size="27" font-weight="700">Silicon Labs controller policy</text>
    <rect x="60" y="180" width="700" height="160" rx="7" fill="#f0f4f7" stroke="#c4d3df"></rect>
    <text x="85" y="211" font-size="21">Direct route 1 -&gt; 7: eligible 100 kbit/s start</text>
    <g id="direct-rate-example">
      <g fill="#d5e4ed" stroke="#7c9db3" stroke-width="1.5">
        <rect data-rate="100000" x="90" y="233" width="145" height="44" rx="5"></rect>
        <rect data-rate="100000" x="300" y="233" width="145" height="44" rx="5"></rect>
        <rect data-rate="40000" x="510" y="233" width="145" height="44" rx="5"></rect>
      </g>
      <g text-anchor="middle" font-size="25" font-weight="700">
        <text x="162.5" y="263">100 kbit/s</text>
        <text x="372.5" y="263">100 kbit/s</text>
        <text x="582.5" y="263">40 kbit/s</text>
      </g>
      <g stroke="#587f98" stroke-width="2.5" marker-end="url(#forward-arrow)">
        <path d="M244 255H290"></path>
        <path d="M454 255H500"></path>
      </g>
      <g text-anchor="middle" font-size="17" fill="#65798b">
        <text x="162.5" y="305">Initial send</text>
        <text x="372.5" y="305">Retry 1</text>
        <text x="582.5" y="305">Retry 2</text>
      </g>
    </g>
    <text x="85" y="329" font-size="17" fill="#526c80">If this is the LWR: all three fail, then try NLWR.</text>
    <g id="policy-flow">
      <g fill="#e9f0f5" stroke="#a6bdcd" stroke-width="1.5">
        <rect id="preferred-route" x="160" y="364" width="520" height="68" rx="6"></rect>
        <rect id="older-route" x="160" y="474" width="520" height="68" rx="6"></rect>
        <rect id="other-attempts" x="160" y="584" width="520" height="82" rx="6"></rect>
        <rect id="explorer-fallback" x="160" y="708" width="520" height="86" rx="6" fill="#c5dce9"></rect>
      </g>
      <g text-anchor="middle" font-size="25">
        <text x="420" y="394">Preferred route / LWR</text>
        <text x="420" y="420" font-size="17">Last Working Route</text>
        <text x="420" y="504">NLWR, if available</text>
        <text x="420" y="530" font-size="17">Next-to-Last Working Route</text>
        <text x="420" y="618">Other eligible attempts</text>
        <text x="420" y="648" font-size="18">Rate fallback, calculated routes, direct sends</text>
        <text x="420" y="745" font-weight="700">Explorer frames</text>
        <text x="420" y="778" font-size="21">if enabled and eligible</text>
      </g>
      <g stroke="#587f98" stroke-width="2.5" marker-end="url(#forward-arrow)">
        <path d="M420 436V465"></path>
        <path d="M420 546V575"></path>
        <path d="M420 670V699"></path>
      </g>
    </g>
    <g font-size="19" fill="#526c80">
      <text x="85" y="836">Routed LWR: first-hop retries stay at the selected rate.</text>
      <text x="85" y="862">If a later hop fails, the source can switch to NLWR.</text>
      <text x="85" y="888">No first-hop confirmation: up to three source sends.</text>
    </g>
    <text x="925" y="155" font-size="27" font-weight="700">Explorer frames: discover a path</text>
    <text x="925" y="188" font-size="19" fill="#526c80">Time flows down. Outgoing copies are broadcasts.</text>
    <g id="explorer-lifelines">
      <g fill="#d8e6ef" stroke="#a6bdcd" stroke-width="1.5">
        <rect x="915" y="221" width="90" height="47" rx="4"></rect>
        <rect x="1175" y="221" width="90" height="47" rx="4"></rect>
        <rect x="1435" y="221" width="90" height="47" rx="4" fill="#eef2f5"></rect>
        <rect x="1695" y="221" width="90" height="47" rx="4"></rect>
      </g>
      <g text-anchor="middle" font-size="21" font-weight="700">
        <text x="960" y="252">Node 1</text>
        <text x="1220" y="252">Node 2</text>
        <text x="1480" y="252">Node 4</text>
        <text x="1740" y="252">Node 7</text>
      </g>
      <g stroke="#bacbd8" stroke-width="1.5" stroke-dasharray="5 6">
        <path data-node="1" d="M960 268V850"></path>
        <path data-node="2" d="M1220 268V850"></path>
        <path data-node="4" d="M1480 268V850"></path>
        <path data-node="7" d="M1740 268V850"></path>
      </g>
    </g>
    <g id="explorer-delays" fill="#e0ebf2" stroke="#b0c4d2">
      <rect data-node="2" x="1213" y="324" width="14" height="92"></rect>
      <rect data-node="4" x="1473" y="324" width="14" height="226" fill="#eef2f5"></rect>
    </g>
    <g id="explorer-sequence">
      <g id="explorer-origin" data-kind="explore" data-sender="1" data-heard-by="2 4" data-original-source="1" data-sequence="7" data-route="">
        <path class="transmission" d="M960 310H1480" fill="none" stroke="#587f98" stroke-width="3" marker-end="url(#forward-arrow)"></path>
        <circle data-reception="2" cx="1220" cy="310" r="6" fill="#ffffff" stroke="#587f98" stroke-width="2"></circle>
        <rect x="1279" y="293" width="142" height="34" rx="4" fill="#d7e8f2" stroke="#a6bdcd"></rect>
        <text x="1350" y="316" text-anchor="middle" font-size="17">Explore []</text>
      </g>
      <g id="first-copy" data-kind="explore" data-sender="2" data-heard-by="7" data-original-source="1" data-sequence="7" data-route="2" data-duplicate="false">
        <path class="transmission" d="M1220 430H1740" fill="none" stroke="#587f98" stroke-width="3" marker-end="url(#forward-arrow)"></path>
        <rect x="1539" y="413" width="142" height="34" rx="4" fill="#c5dce9" stroke="#8fb1c7"></rect>
        <text x="1610" y="436" text-anchor="middle" font-size="17">Explore [2]</text>
      </g>
      <g id="duplicate-copy" data-kind="explore" data-sender="4" data-heard-by="7" data-original-source="1" data-sequence="7" data-route="4" data-duplicate="true" data-assumption="destination-duplicate-discard">
        <path class="transmission" d="M1480 564H1740" fill="none" stroke="#95a8b7" stroke-width="3" marker-end="url(#duplicate-arrow)"></path>
        <rect x="1539" y="547" width="142" height="34" rx="4" fill="#edf1f5" stroke="#afbfca"></rect>
        <text x="1610" y="570" text-anchor="middle" font-size="17" fill="#6d8597">Explore [4]</text>
      </g>
      <g id="result-7-2" data-kind="result" data-sender="7" data-receiver="2" data-route="2">
        <path class="transmission" d="M1740 686H1220" fill="none" stroke="#274a64" stroke-width="3" marker-end="url(#return-arrow)"></path>
        <use href="#search-result-shape" x="1350" y="686"></use>
      </g>
      <g id="result-2-1" data-kind="result" data-sender="2" data-receiver="1" data-route="2">
        <path class="transmission" d="M1220 806H960" fill="none" stroke="#274a64" stroke-width="3" marker-end="url(#return-arrow)"></path>
        <use href="#search-result-shape" x="1090" y="806"></use>
      </g>
    </g>
    <g font-size="16" fill="#526c80">
      <text x="975" y="344">2 and 4 hear the same transmission.</text>
      <text x="1050" y="388">Random delay</text>
      <text x="1280" y="520">Random delay</text>
      <text x="1740" y="470" text-anchor="end">7 keeps the first copy.</text>
      <text x="1740" y="607" text-anchor="end">7 discards the later copy.</text>
      <text x="1480" y="649" font-size="16">Answer the first copy, through node 2.</text>
      <text x="925" y="880" font-size="18">Stop cancels remaining queued copies at nodes hearing the result.</text>
      <text x="925" y="906" font-size="18">Later traffic: 1 -&gt; 2 -&gt; 7. Other receptions omitted.</text>
    </g>
    <path d="M60 920H1860" stroke="#d6e1e9" stroke-width="2"></path>
    <g font-size="21">
      <text x="60" y="966">MAC rule for acknowledged singlecast: initial send + up to two retries. Random backoff: 10-40 ms.</text>
      <text x="60" y="1003">Network rule: at least three direct/routed attempts before Normal Explore recovery.</text>
    </g>
    <text x="60" y="1044" font-size="18" fill="#65798b">Simplified controller-policy illustration. Exact transmission order depends on the frame, configuration, and available paths.</text>
  </g>
</svg>