<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">The same command at three speeds</title>
  <desc id="description">Three rate cards include rectangular frequency-state sketches for byte 20 hexadecimal, bits 00100000 sent most significant bit first. Each bit has a shaded cell. Manchester at 9.6 kbit/s changes frequency midway through each bit. NRZ at 40 and 100 kbit/s holds a frequency state for each bit. These normalized sketches idealize the filtered GFSK transitions. Proportional timing bars below retain actual durations of 24.17, 5.60, and 4.72 ms for the routed Basic Set. ACKs and waiting are excluded.</desc>
  <defs>
    <g id="encoding-bit-cells" data-byte="20" data-bits="00100000">
      <g>
        <rect data-bit="7" data-value="0" x="0" y="0" width="32" height="72" fill="#e4ebf1"></rect>
        <rect data-bit="6" data-value="0" x="32" y="0" width="32" height="72" fill="#f7f9fb"></rect>
        <rect data-bit="5" data-value="1" x="64" y="0" width="32" height="72" fill="#bdd9e8"></rect>
        <rect data-bit="4" data-value="0" x="96" y="0" width="32" height="72" fill="#f7f9fb"></rect>
        <rect data-bit="3" data-value="0" x="128" y="0" width="32" height="72" fill="#e4ebf1"></rect>
        <rect data-bit="2" data-value="0" x="160" y="0" width="32" height="72" fill="#f7f9fb"></rect>
        <rect data-bit="1" data-value="0" x="192" y="0" width="32" height="72" fill="#e4ebf1"></rect>
        <rect data-bit="0" data-value="0" x="224" y="0" width="32" height="72" fill="#f7f9fb"></rect>
      </g>
      <path d="M0 21V72 M32 21V72 M64 21V72 M96 21V72 M128 21V72 M160 21V72 M192 21V72 M224 21V72 M256 21V72" fill="none" stroke="#c3d0db" stroke-width="0.8" stroke-dasharray="2 3"></path>
      <g font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#526c80">
        <text x="16" y="16">0</text>
        <text x="48" y="16">0</text>
        <text x="80" y="16" font-weight="700" fill="#234e69">1</text>
        <text x="112" y="16">0</text>
        <text x="144" y="16">0</text>
        <text x="176" y="16">0</text>
        <text x="208" y="16">0</text>
        <text x="240" y="16">0</text>
      </g>
      <g font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#526c80">
        <text x="-12" y="35">H</text>
        <text x="-12" y="63">L</text>
      </g>
    </g>
    <path id="manchester-wave" d="M0 58H16V30H32V58H48V30H80V58H112V30H128V58H144V30H160V58H176V30H192V58H208V30H224V58H240V30H256" fill="none" stroke="#315d79" stroke-width="2.5" stroke-linejoin="miter"></path>
    <path id="nrz-wave" d="M0 30H64V58H96V30H256" fill="none" stroke="#315d79" stroke-width="2.5" stroke-linejoin="miter"></path>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"></rect>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243b4c">
    <text x="60" y="68" font-size="42" font-weight="700">The same command at three speeds</text>
    <text x="60" y="108" font-size="23" fill="#65798b">Classic Z-Wave: one command, three radio configurations.</text>
    <g fill="#edf2f6" stroke="#bacbd8" stroke-width="1.5">
      <rect x="60" y="146" width="560" height="148" rx="6"></rect>
      <rect x="680" y="146" width="560" height="148" rx="6"></rect>
      <rect x="1300" y="146" width="560" height="148" rx="6"></rect>
    </g>
    <g>
      <g font-size="32" font-weight="700">
        <text x="82" y="190">9.6 kbit/s</text>
        <text x="702" y="190">40 kbit/s</text>
        <text x="1322" y="190">100 kbit/s</text>
      </g>
      <g font-size="20">
        <text x="82" y="230">FSK / Manchester</text>
        <text x="702" y="230">FSK / NRZ</text>
        <text x="1322" y="230">GFSK / NRZ</text>
        <text x="82" y="269">8-bit XOR + EOF</text>
        <text x="702" y="269">8-bit XOR</text>
        <text x="1322" y="269">CRC-16</text>
      </g>
    </g>
    <g id="encoding-9600" data-encoding="manchester" transform="translate(320 200)">
      <use href="#encoding-bit-cells"></use>
      <use href="#manchester-wave"></use>
    </g>
    <g id="encoding-40000" data-encoding="nrz" transform="translate(940 200)">
      <use href="#encoding-bit-cells"></use>
      <use href="#nrz-wave"></use>
    </g>
    <g id="encoding-100000" data-encoding="nrz" data-idealized="true" transform="translate(1560 200)">
      <use href="#encoding-bit-cells"></use>
      <use href="#nrz-wave"></use>
    </g>
    <text x="60" y="322" font-size="18" fill="#65798b">Encoding sketches: 0x20, MSB first. H/L are relative frequency states. Bit widths are normalized. Actual GFSK transitions are smoothed.</text>
    <text x="60" y="350" font-size="24">One routed Basic Set transmission: 3 application bytes + two repeater IDs.</text>
    <g stroke="#dce4eb" stroke-width="1.5">
      <path d="M250 430V821 M550 430V821 M850 430V821 M1150 430V821 M1450 430V821 M1750 430V821"></path>
    </g>
    <g text-anchor="middle" font-size="21" fill="#65798b">
      <text x="250" y="414">0</text>
      <text x="550" y="414">5</text>
      <text x="850" y="414">10</text>
      <text x="1150" y="414">15</text>
      <text x="1450" y="414">20</text>
      <text x="1750" y="414">25 ms</text>
    </g>
    <g font-size="29" font-weight="700">
      <text x="60" y="496">9.6 kbit/s</text>
      <text x="60" y="636">40 kbit/s</text>
      <text x="60" y="776">100 kbit/s</text>
    </g>
    <g font-size="20" fill="#65798b">
      <text x="60" y="529">0.833 ms / byte</text>
      <text x="60" y="669">0.200 ms / byte</text>
      <text x="60" y="809">0.080 ms / byte</text>
    </g>
    <g id="rate-9600" data-rate="9600" stroke="#ffffff" stroke-width="1">
      <rect data-part="preamble" x="250" y="460" width="500" height="60" fill="#e1e8ef"></rect>
      <rect data-part="sof" x="750" y="460" width="50" height="60" fill="#263d53"></rect>
      <rect data-part="mac" x="800" y="460" width="450" height="60" fill="#789ab6"></rect>
      <rect data-part="routing" x="1250" y="460" width="200" height="60" fill="#477795"></rect>
      <rect data-part="application" x="1450" y="460" width="150" height="60" fill="#9ccbd6"></rect>
      <rect data-part="fcs" x="1600" y="460" width="50" height="60" fill="#69759c"></rect>
      <rect data-part="eof" data-bit-periods="8" x="1650" y="460" width="50" height="60" fill="#4f606f"></rect>
    </g>
    <g id="rate-40000" data-rate="40000" stroke="#ffffff" stroke-width="1">
      <rect data-part="preamble" x="250" y="600" width="120" height="60" fill="#e1e8ef"></rect>
      <rect data-part="sof" x="370" y="600" width="12" height="60" fill="#263d53"></rect>
      <rect data-part="mac" x="382" y="600" width="108" height="60" fill="#789ab6"></rect>
      <rect data-part="routing" x="490" y="600" width="48" height="60" fill="#477795"></rect>
      <rect data-part="application" x="538" y="600" width="36" height="60" fill="#9ccbd6"></rect>
      <rect data-part="fcs" x="574" y="600" width="12" height="60" fill="#69759c"></rect>
    </g>
    <g id="rate-100000" data-rate="100000" stroke="#ffffff" stroke-width="1">
      <rect data-part="preamble" x="250" y="740" width="192" height="60" fill="#e1e8ef"></rect>
      <rect data-part="sof" x="442" y="740" width="4.8" height="60" fill="#263d53"></rect>
      <rect data-part="mac" x="446.8" y="740" width="43.2" height="60" fill="#789ab6"></rect>
      <rect data-part="routing" x="490" y="740" width="19.2" height="60" fill="#477795"></rect>
      <rect data-part="application" x="509.2" y="740" width="14.4" height="60" fill="#9ccbd6"></rect>
      <rect data-part="fcs" x="523.6" y="740" width="9.6" height="60" fill="#69759c"></rect>
    </g>
    <g text-anchor="middle">
      <g font-size="21">
        <text x="500" y="487">Preamble</text>
        <text x="500" y="513" font-size="18">8.333 ms</text>
        <text x="1025" y="487" fill="#ffffff">MAC header</text>
        <text x="1025" y="513" font-size="18" fill="#ffffff">7.500 ms</text>
        <text x="1350" y="487" fill="#ffffff">Routing</text>
        <text x="1350" y="513" font-size="18" fill="#ffffff">3.333 ms</text>
        <text x="1525" y="487">Basic Set</text>
        <text x="1525" y="513" font-size="18">2.500 ms</text>
      </g>
      <g font-size="17" fill="#ffffff">
        <text x="775" y="486">SOF</text>
        <text x="1625" y="486">FCS</text>
        <text x="1675" y="486">EOF</text>
      </g>
      <g font-size="13" fill="#ffffff">
        <text x="775" y="509">0.833</text>
        <text x="1625" y="509">0.833</text>
        <text x="1675" y="509">0.833</text>
      </g>
      <g font-size="18">
        <text x="310" y="637">Preamble</text>
        <text x="436" y="637" fill="#ffffff">Header</text>
        <text x="514" y="637" fill="#ffffff">R</text>
        <text x="556" y="637">B</text>
        <text x="346" y="777">Preamble</text>
        <text x="468.4" y="777" fill="#ffffff">H</text>
        <text x="499.6" y="777" font-size="12" fill="#ffffff">R</text>
        <text x="516.4" y="777" font-size="11">B</text>
      </g>
    </g>
    <g font-size="29" font-weight="700">
      <text x="1718" y="497">24.17 ms</text>
      <text x="606" y="637">5.60 ms</text>
      <text x="553.2" y="777">4.72 ms</text>
    </g>
    <g font-size="20">
      <rect x="60" y="867" width="22" height="22" fill="#e1e8ef"></rect><text x="94" y="885">Preamble</text>
      <rect x="290" y="867" width="22" height="22" fill="#263d53"></rect><text x="324" y="885">SOF</text>
      <rect x="470" y="867" width="22" height="22" fill="#789ab6"></rect><text x="504" y="885">MAC header (H)</text>
      <rect x="780" y="867" width="22" height="22" fill="#477795"></rect><text x="814" y="885">Routing (R)</text>
      <rect x="1050" y="867" width="22" height="22" fill="#9ccbd6"></rect><text x="1084" y="885">Basic Set (B)</text>
      <rect x="1370" y="867" width="22" height="22" fill="#69759c"></rect><text x="1404" y="885">FCS</text>
      <rect x="1570" y="867" width="22" height="22" fill="#4f606f"></rect><text x="1604" y="885">EOF</text>
    </g>
    <text x="60" y="949" font-size="28" font-weight="700">Every forward or retry transmits another complete frame.</text>
    <text x="60" y="997" font-size="20" fill="#65798b">One common time scale. Segment times are in ms. EOF at 9.6 kbit/s occupies eight bit periods.</text>
    <text x="60" y="1036" font-size="19" fill="#65798b">Minimum ordinary two-channel preambles. ACKs, turnaround, backoff, beaming, and retries are excluded.</text>
  </g>
</svg>