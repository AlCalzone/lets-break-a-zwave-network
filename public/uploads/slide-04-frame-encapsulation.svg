<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Inside a Z-Wave frame: Basic Set to MPDU to PPDU</title>
  <desc id="description">Three vertically arranged byte rows connected by translucent ribbons. Basic Set contains 20 01 FF. Those bytes become the payload of a 13-byte MAC frame. The entire MAC frame becomes the PSDU of a 24-byte PHY frame at 40 kbit/s, preceded by ten 55 preamble bytes and the F0 start-of-frame byte. A dashed EOF block after the PSDU shows the required end delimiter for the 9.6 kbit/s variant. Explanations appear on the right.</desc>
  <defs>
    <g id="basic-bytes" data-bytes="20 01 FF">
      <rect width="40" height="48" fill="#87b4c9"></rect>
      <rect x="40" width="40" height="48" fill="#a5c5d4"></rect>
      <rect x="80" width="40" height="48" fill="#659ab3"></rect>
      <path d="M0 0H120V48H0Z M40 0V48 M80 0V48" fill="none" stroke="#ffffff" stroke-width="1.2"></path>
      <g font-family="monospace" font-size="19" text-anchor="middle" fill="#172d3b">
        <text x="20" y="31">20</text>
        <text x="60" y="31">01</text>
        <text x="100" y="31">FF</text>
      </g>
    </g>
    <g id="mac-bytes" data-bytes="12 34 56 78 01 41 03 0D 07 20 01 FF 60">
      <rect width="160" height="48" fill="#d9e3eb"></rect>
      <rect x="160" width="40" height="48" fill="#c5d4e0"></rect>
      <rect x="200" width="80" height="48" fill="#dce6ee"></rect>
      <rect x="280" width="40" height="48" fill="#becfdd"></rect>
      <rect x="320" width="40" height="48" fill="#c5d4e0"></rect>
      <use href="#basic-bytes" x="360"></use>
      <rect x="480" width="40" height="48" fill="#9db1c4"></rect>
      <path d="M0 0H520V48H0Z M40 0V48 M80 0V48 M120 0V48 M160 0V48 M200 0V48 M240 0V48 M280 0V48 M320 0V48 M360 0V48 M480 0V48" fill="none" stroke="#ffffff" stroke-width="1.2"></path>
      <g font-family="monospace" font-size="19" text-anchor="middle" fill="#334b5e">
        <text x="20" y="31">12</text>
        <text x="60" y="31">34</text>
        <text x="100" y="31">56</text>
        <text x="140" y="31">78</text>
        <text x="180" y="31">01</text>
        <text x="220" y="31">41</text>
        <text x="260" y="31">03</text>
        <text x="300" y="31">0D</text>
        <text x="340" y="31">07</text>
        <text x="500" y="31">60</text>
      </g>
    </g>
    <g id="preamble-bytes" data-bytes="55 55 55 55 55 55 55 55 55 55">
      <rect width="400" height="48" fill="#edf1f5"></rect>
      <path d="M0 0H400V48H0Z M40 0V48 M80 0V48 M120 0V48 M160 0V48 M200 0V48 M240 0V48 M280 0V48 M320 0V48 M360 0V48" fill="none" stroke="#ffffff" stroke-width="1.2"></path>
      <g font-family="monospace" font-size="19" text-anchor="middle" fill="#8191a0">
        <text x="20" y="31">55</text>
        <text x="60" y="31">55</text>
        <text x="100" y="31">55</text>
        <text x="140" y="31">55</text>
        <text x="180" y="31">55</text>
        <text x="220" y="31">55</text>
        <text x="260" y="31">55</text>
        <text x="300" y="31">55</text>
        <text x="340" y="31">55</text>
        <text x="380" y="31">55</text>
      </g>
    </g>
  </defs>
  <rect width="1440" height="810" fill="#ffffff"></rect>
  <g id="command-ribbons" fill-opacity="0.3">
    <path d="M520 248C520 320 690 328 690 400H730C730 328 560 320 560 248Z" fill="#87b4c9"></path>
    <path d="M560 248C560 320 730 328 730 400H770C770 328 600 320 600 248Z" fill="#a5c5d4"></path>
    <path d="M600 248C600 320 770 328 770 400H810C810 328 640 320 640 248Z" fill="#659ab3"></path>
  </g>
  <g id="mac-ribbons" fill-opacity="0.32">
    <path d="M330 448C330 520 488 548 488 620H648C648 548 490 520 490 448Z" fill="#d9e3eb"></path>
    <path d="M490 448C490 520 648 548 648 620H688C688 548 530 520 530 448Z" fill="#c5d4e0"></path>
    <path d="M530 448C530 520 688 548 688 620H768C768 548 610 520 610 448Z" fill="#dce6ee"></path>
    <path d="M610 448C610 520 768 548 768 620H808C808 548 650 520 650 448Z" fill="#becfdd"></path>
    <path d="M650 448C650 520 808 548 808 620H848C848 548 690 520 690 448Z" fill="#c5d4e0"></path>
    <path d="M690 448C690 520 848 548 848 620H888C888 548 730 520 730 448Z" fill="#87b4c9"></path>
    <path d="M730 448C730 520 888 548 888 620H928C928 548 770 520 770 448Z" fill="#a5c5d4"></path>
    <path d="M770 448C770 520 928 548 928 620H968C968 548 810 520 810 448Z" fill="#659ab3"></path>
    <path d="M810 448C810 520 968 548 968 620H1008C1008 548 850 520 850 448Z" fill="#9db1c4"></path>
  </g>
  <use id="application-row" href="#basic-bytes" x="520" y="200"></use>
  <use id="mac-row" href="#mac-bytes" x="330" y="400"></use>
  <use id="phy-preamble" href="#preamble-bytes" x="48" y="620"></use>
  <rect id="phy-sof" data-bytes="F0" x="448" y="620" width="40" height="48" fill="#c0d0df" stroke="#ffffff" stroke-width="1.2"></rect>
  <use id="phy-psdu" href="#mac-bytes" x="488" y="620"></use>
  <g id="phy-eof" data-rate="9600" data-bit-periods="8">
    <rect x="1008" y="620" width="40" height="48" fill="#f5f7fa" stroke="#71879a" stroke-width="1.5" stroke-dasharray="4 3"></rect>
    <text x="1028" y="649" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#526b80">EOF</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243b4c">
    <text x="48" y="54" font-size="32" font-weight="700">Inside a Z-Wave frame</text>
    <text x="48" y="83" font-size="17" fill="#65798b">40 kbit/s | Direct singlecast | Controller 1 to lamp 7 | Unencrypted example</text>
    <g font-size="23" font-weight="700">
      <text x="48" y="148">Basic CC Set</text>
      <text x="48" y="348">MAC frame / MPDU</text>
      <text x="48" y="568">PHY frame / PPDU</text>
    </g>
    <g font-size="16" fill="#65798b">
      <text x="48" y="176">3 bytes</text>
      <text x="48" y="376">13 bytes</text>
      <text x="48" y="596">24 bytes at 40 kbit/s</text>
    </g>
    <text x="580" y="155" text-anchor="middle" font-size="20">&#34;Turn the lamp on&#34;</text>
    <g text-anchor="middle" font-size="14">
      <text x="540" y="188">Basic CC</text>
      <text x="580" y="188">Set</text>
      <text x="620" y="188">On</text>
      <text x="410" y="382">Home ID</text>
      <text x="510" y="382">Src</text>
      <text x="570" y="382">Control</text>
      <text x="630" y="382">Len</text>
      <text x="670" y="382">Dest</text>
      <text x="750" y="382">Payload</text>
      <text x="830" y="382">FCS</text>
      <text x="248" y="605">Preamble: 10 bytes</text>
      <text x="468" y="605">SOF</text>
      <text x="748" y="605">PSDU: the complete MAC frame</text>
      <text x="1028" y="605">EOF*</text>
    </g>
    <text x="468" y="651" text-anchor="middle" font-family="monospace" font-size="19">F0</text>
    <path d="M488 679V690H1008V679" fill="none" stroke="#8a9dae" stroke-width="1.5"></path>
    <text x="748" y="715" text-anchor="middle" font-size="16">All 13 MPDU bytes are carried unchanged as the PSDU.</text>
    <path d="M1064 130V734" fill="none" stroke="#e1e8ee" stroke-width="1.5"></path>
    <g font-size="17">
      <text x="1080" y="158" font-weight="700">Application meaning</text>
      <text x="1080" y="194">20: Basic Command Class</text>
      <text x="1080" y="222">01: Set</text>
      <text x="1080" y="250">FF: On for this lamp</text>
      <text x="1080" y="348" font-weight="700">Delivery and integrity</text>
      <text x="1080" y="384">Network: 12 34 56 78</text>
      <text x="1080" y="412">From node 1 to node 7</text>
      <text x="1080" y="440">ACK requested, sequence 3</text>
      <text x="1080" y="468">0D: 13 bytes including FCS</text>
      <text x="1080" y="496">60: XOR checksum</text>
      <text x="1080" y="568" font-weight="700">Radio synchronization</text>
      <text x="1080" y="604">55: repeating 01010101</text>
      <text x="1080" y="632">F0: 11110000, start of frame</text>
      <text x="1080" y="660">PSDU carries the MPDU</text>
      <text x="1080" y="688">*EOF: 9.6 kbit/s only</text>
      <text x="1080" y="716">8 Manchester code violations</text>
    </g>
    <g font-size="14" fill="#65798b">
      <text x="48" y="756">Solid cells show hex bytes. The dashed EOF represents eight bit periods of a special physical-layer pattern.</text>
      <text x="48" y="783">EOF is required at 9.6 kbit/s and absent at 40/100 kbit/s. The PSDU and its checksum coverage end before EOF.</text>
    </g>
  </g>
</svg>